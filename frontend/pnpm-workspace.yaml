packages:
  - "packages/*"

# pnpm 11 no longer reads pnpm-specific settings (such as `shamefully-hoist`)
# from .npmrc, so the public hoisting this project relies on is declared here.
# uno.config.ts imports @unocss/preset-wind3 without listing it as a dependency.
publicHoistPattern:
  - "*"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
