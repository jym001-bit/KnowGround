<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>404 · 页面不见了 | 知据</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #232323; background: #fff; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 56px; text-align: center; }
    .code { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 2.6vw, 38px); height: 185px; margin-bottom: 44px; color: #6e6e6e; }
    .digit { font-size: clamp(108px, 12vw, 164px); font-weight: 650; line-height: 1; letter-spacing: -.08em; }
    .ghost { width: clamp(92px, 10vw, 138px); height: auto; margin: 5px 0 0; animation: float 4s ease-in-out infinite; }
    h1 { margin: 0; font-size: clamp(36px, 5.4vw, 68px); font-weight: 740; letter-spacing: -.055em; line-height: 1.17; }
    .description { margin: 24px 0 0; color: #3a3a3a; font-size: clamp(17px, 2vw, 26px); line-height: 1.55; }
    .return { display: inline-flex; align-items: center; justify-content: center; min-width: 218px; min-height: 70px; margin-top: 66px; padding: 14px 34px; border-radius: 999px; background: #222; color: #fff; font-size: 24px; text-decoration: none; transition: transform .2s ease, background .2s ease; }
    .return:hover { transform: translateY(-2px); background: #3b3b3b; }
    .return:focus-visible, summary:focus-visible { outline: 3px solid #8b8b8b; outline-offset: 5px; }
    details { margin-top: 70px; color: #909090; font-size: 21px; }
    summary { cursor: pointer; text-decoration: underline; text-underline-offset: 5px; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    details p { max-width: 360px; margin: 17px auto 0; color: #6f6f6f; font-size: 15px; line-height: 1.7; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
    @media (max-width: 600px) { main { padding: 36px 20px; } .code { height: 125px; margin-bottom: 28px; } .description { margin-top: 18px; } .return { min-width: 190px; min-height: 58px; margin-top: 46px; font-size: 19px; } details { margin-top: 54px; font-size: 17px; } }
    @media (prefers-reduced-motion: reduce) { .ghost { animation: none; } .return { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">
      <span class="digit">4</span>
      <svg class="ghost" viewBox="0 0 134 166" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#666" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M31 65C32 30 45 9 67 8c23-1 35 21 36 56 6-8 10-14 16-11 6 3 8 20 12 26-4 8-10 10-17 6-3 11-8 16-15 17v27c0 6-4 11-10 10-5 0-6-7-8-8-2 3-4 16-11 17-6 1-9-7-12-8-4 4-8 12-14 10-7-2-7-10-7-16-8-2-13-8-16-17-7 3-15 0-18-6 3-8 4-24 11-29 6-4 11 3 17 11Z"/>
          <path d="M29 67c-4 16-4 31 5 42M103 67c4 16 4 31-5 42M41 43c3-15 10-24 21-27M52 110v28M81 108v23M20 69c1 5 5 10 10 11M114 81c5 1 9-2 11-6" opacity=".72"/>
          <ellipse cx="56" cy="55" rx="3.4" ry="6.5" fill="#666" stroke="none"/>
          <ellipse cx="78" cy="55" rx="3.4" ry="6.5" fill="#666" stroke="none"/>
          <path d="M66 73c2 2 4 2 6 0"/>
        </g>
      </svg>
      <span class="digit">4</span>
    </div>
    <h1>Boo! 页面不见了</h1>
    <p class="description">你要找的页面，像幽灵一样不在这里。</p>
    <a class="return" href="https://knowground.jymcode.top/">返回知据</a>
    <details>
      <summary>什么是 404？</summary>
      <p>服务器找不到这个地址对应的页面。请检查链接，或返回知据继续使用。</p>
    </details>
  </main>
</body>
</html>
